<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shree Code Mantra</title>
    <!-- Google Fonts - Syne & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.15"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: 'rgba(255,85,0,0.15)', 
                            DEFAULT: '#FF5500',  
                            hover: '#ff7733',    
                            dark: '#0a0300',     
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        head: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .error-label {
            color: #dc2626;
            font-size: 0.75rem;
            display: block;
            text-align: left;
            margin-top: 0.25rem;
        }
        body {
            background-image: radial-gradient(circle at 100% 100%, rgba(255, 85, 0, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 0% 0%, rgba(255, 85, 0, 0.05) 0%, transparent 50%);
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-[#0e0e0e] selection:bg-brand selection:text-white relative">
    
    <div class="w-full max-w-md relative z-10">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-head font-extrabold tracking-tight text-slate-800">
                SHREE <span class="text-brand">ADMIN</span>
            </h1>
            <p class="text-slate-500 mt-2 text-sm">Secure access to the management dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-brand/5 border border-slate-100 overflow-hidden">
            <!-- Login Form -->
            <div class="p-8">
                <form id="adminLoginForm" action="" method="get">
                    <!-- Email Field -->
                    <div class="mb-5 relative group">
                        <label for="adminEmail" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                            Email Address
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand transition-colors">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input 
                                name="email" 
                                type="text" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all text-sm" 
                                id="adminEmail" 
                                placeholder="admin@example.com"
                            >
                        </div>
                        <small id="adminEmailError" class="error-label"></small>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-8 relative group">
                        <label for="adminPassword" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand transition-colors">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input 
                                name="password" 
                                type="password" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all text-sm" 
                                id="adminPassword" 
                                placeholder="Enter your password"
                            >
                        </div>
                        <small id="adminPasswordError" class="error-label"></small>
                    </div>

                    <!-- Submit Button -->
                    <div class="mb-4">
                        <button 
                            type="submit" 
                            id="adminSubmit" 
                            class="w-full bg-brand hover:bg-brand-hover text-white font-semibold py-3 px-4 rounded-xl transition-all duration-300 transform active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-brand/20 flex justify-center items-center gap-2 shadow-lg shadow-brand/30"
                        >
                            <span>Authenticate</span>
                            <i class="fas fa-arrow-right text-sm"></i>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Alternative Link -->
            <div class="bg-slate-50 p-4 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-600">
                    Not an admin? 
                    <a href="{{ url_for('home') }}" class="text-brand hover:text-brand-hover font-semibold transition duration-200">
                        Go to Home Page
                    </a>
                </p>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 text-center text-xs text-slate-400">
            <p>© 2025 Shree Code Mantra. All rights reserved.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("adminLoginForm");

            const fields = {
                email: document.getElementById("adminEmail"),
                password: document.getElementById("adminPassword")
            };

            const errors = {
                email: document.getElementById("adminEmailError"),
                password: document.getElementById("adminPasswordError")
            };

            // Validation helpers
            function markInvalid(field) {
                field.classList.add("border-red-500");
                field.classList.remove("border-green-500");
            }
            
            function markValid(field) {
                field.classList.remove("border-red-500");
                field.classList.add("border-green-500");
            }
            
            function resetField(field) {
                field.classList.remove("border-red-500", "border-green-500");
            }

            function validateEmail() {
                const value = fields.email.value.trim();
                const pattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
                
                if (value === "") {
                    errors.email.textContent = " * Email is required.";
                    markInvalid(fields.email);
                    return false;
                } else if (!pattern.test(value)) {
                    errors.email.textContent = " * Please enter a valid email address.";
                    markInvalid(fields.email);
                    return false;
                }
                
                errors.email.textContent = "";
                markValid(fields.email);
                return true;
            }

            function validatePassword() {
                const value = fields.password.value.trim();
                
                if (value === "") {
                    errors.password.textContent = " * Password is required.";
                    markInvalid(fields.password);
                    return false;
                }
                
                errors.password.textContent = "";
                markValid(fields.password);
                return true;
            }

            // Real-time validation
            fields.email.addEventListener("input", function() {
                if (fields.email.value.trim() === "") {
                    resetField(fields.email);
                    errors.email.textContent = "";
                } else {
                    validateEmail();
                }
            });
            
            fields.password.addEventListener("input", function() {
                if (fields.password.value.trim() === "") {
                    resetField(fields.password);
                    errors.password.textContent = "";
                } else {
                    validatePassword();
                }
            });

            // Submit handler
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();

                if (isEmailValid && isPasswordValid) {
                    // Disable submit button and show loading state
                    const submitBtn = document.getElementById("adminSubmit");
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
                    
                    $.ajax({
                        type: "POST",
                        url: "/admin/login",
                        data: $("#adminLoginForm").serialize(),
                        success: function (response) {
                            if (response.status === "success") {
                                // Show success message before redirect
                                submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i> Login Successful!';
                                submitBtn.classList.remove("bg-blue-600", "hover:bg-blue-700");
                                submitBtn.classList.add("bg-green-600");
                                
                                // Redirect to admin dashboard after a brief delay
                                setTimeout(function() {
                                    window.location.replace("/admin/dashboard");
                                }, 1000);
                            } else {
                                // Reset button state
                                submitBtn.disabled = false;
                                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Login';
                                
                                // Show error message
                                alert(response.error || "Login failed. Please try again.");
                                
                                // Reset form validation states
                                Object.values(fields).forEach(field => resetField(field));
                            }
                        },
                        error: function (xhr, status, error) {
                            console.error("Login error:", error);
                            
                            // Reset button state
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Login';
                            
                            // Show error message
                            alert("An error occurred during login. Please try again.");
                        }
                    });
                }
            });
            
            // Add focus effects
            Object.values(fields).forEach(field => {
                field.addEventListener('focus', function() {
                    this.parentElement.classList.add('ring-2', 'ring-blue-200');
                });
                
                field.addEventListener('blur', function() {
                    this.parentElement.classList.remove('ring-2', 'ring-blue-200');
                });
            });
        });
    </script>
</body>
</html>
